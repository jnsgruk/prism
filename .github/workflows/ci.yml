name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust protoc
          cache_key_prefix: mise-rust-checks

      - name: Install native dependencies
        run: mise run --skip-tools install-deps

      # Default cache keys include the job ID, toolchain, manifests and Rust flags.
      - uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting and lint
        run: mise run --skip-tools check:rs

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust protoc github:nextest-rs/nextest
          cache_key_prefix: mise-rust-tests

      - name: Install native dependencies
        run: mise run --skip-tools install-deps

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: mise run --skip-tools test:rs

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: bun node vp
          cache_key_prefix: mise-frontend

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Check frontend formatting, lint and types
        run: mise run --skip-tools check:ts

      - name: Run frontend tests
        run: mise run --skip-tools test:ts

  protobuf:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          install_args: buf
          cache_key_prefix: mise-protobuf

      - name: Lint protobuf definitions
        run: mise run --skip-tools check:proto

      - name: Check for breaking changes
        if: github.event_name == 'pull_request'
        run: cd proto && buf breaking --against '../.git#branch=origin/${{ github.base_ref }},subdir=proto'
