apiVersion: v1
kind: Service
metadata:
  name: restate
spec:
  selector:
    app: restate
  ports:
    - name: ingress
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9070
      targetPort: 9070
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: restate
spec:
  serviceName: restate
  replicas: 1
  selector:
    matchLabels:
      app: restate
  template:
    metadata:
      labels:
        app: restate
    spec:
      containers:
        - name: restate
          image: docker.io/restatedev/restate:1.6
          ports:
            - containerPort: 8080
            - containerPort: 9070
          env:
            - name: RESTATE_BASE_DIR
              value: /restate-data/store
            - name: RESTATE_DEFAULT_NUM_PARTITIONS
              value: "4"
            - name: RESTATE_DEFAULT_JOURNAL_RETENTION
              value: "7d"
            - name: RESTATE_WORKER__INVOKER__ABORT_TIMEOUT
              value: "10min"
            # Request suspension after this long without a new journal entry.
            # IngestionChunkService advertises a 15-minute service override for
            # external API reads/retries performed outside journaled steps.
            - name: RESTATE_WORKER__INVOKER__INACTIVITY_TIMEOUT
              value: "5s"
          volumeMounts:
            - name: restate-workspace
              mountPath: /restate-data
              subPath: restate-data
          resources:
            requests:
              memory: 2Gi
              cpu: 100m
            limits:
              memory: 4Gi
      volumes:
        # Keep this name distinct from the historical `restate-data`
        # volumeClaimTemplate retained on existing StatefulSets. Kubernetes
        # otherwise injects the old per-pod PVC in place of this volume.
        - name: restate-workspace
          persistentVolumeClaim:
            # The rawfile CSI pool cannot allocate another volume, while this
            # durable 50 GiB claim has ample headroom on the single-node cluster.
            claimName: prism-workspaces
